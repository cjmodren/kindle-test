<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Auto-refreshes the page every 15 minutes (900 seconds) -->
  <meta http-equiv="refresh" content="900">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Dashboard</title>
  <style>
    /* Monochrome optimization for E-Ink */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 30px;
    }
    .top-section {
      margin-top: 20px;
    }
    .location {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .date {
      font-size: 1.8rem;
      margin-top: 10px;
      font-weight: 500;
    }
    .time {
      font-size: 6.5rem;
      font-weight: bold;
      line-height: 1;
      margin: 20px 0;
    }
    .divider {
      border: none;
      border-bottom: 4px solid #000000;
      margin: 20px auto;
      width: 80%;
    }
    .weather-section {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
    }
    .temp {
      font-size: 5rem;
      font-weight: bold;
    }
    .details {
      text-align: left;
      font-size: 1.5rem;
      line-height: 1.6;
    }
    .status {
      font-size: 1rem;
      color: #333333;
    }
  </style>
</head>
<body>

  <div class="top-section">
    <div class="location">Plant City, FL</div>
    <div id="date" class="date">--</div>
    <div id="time" class="time">--:--</div>
  </div>

  <hr class="divider">

  <div class="weather-section">
    <div id="temp" class="temp">--°F</div>
    <div class="details">
      <div id="condition">Loading...</div>
      <div>Humidity: <span id="humidity">--</span>%</div>
      <div>Wind: <span id="wind">--</span> mph</div>
    </div>
  </div>

  <div id="last-updated" class="status">Updating...</div>

  <script>
    function updateClock() {
      var now = new Date();
      
      // Date string format: Monday, Aug 24
      var dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString('en-US', dateOptions);

      // Time string format: 12-hour format
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // '0' becomes '12'
      minutes = minutes < 10 ? '0' + minutes : minutes;
      
      document.getElementById('time').innerText = hours + ':' + minutes + ' ' + ampm;
    }

    // WMO Weather interpretation codes
    function getWeatherCondition(code) {
      if (code === 0) return "Clear Sky";
      if (code === 1 || code === 2 || code === 3) return "Partly Cloudy";
      if (code >= 45 && code <= 48) return "Foggy";
      if (code >= 51 && code <= 55) return "Drizzle";
      if (code >= 61 && code <= 65) return "Rain";
      if (code >= 80 && code <= 82) return "Showers";
      if (code >= 95) return "Thunderstorm";
      return "Overcast";
    }

    function fetchWeather() {
      // Plant City Coordinates: 28.0181, -82.1226
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=28.0181&longitude=-82.1226&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          var current = data.current;

          document.getElementById('temp').innerText = Math.round(current.temperature_2m) + '°F';
          document.getElementById('condition').innerText = getWeatherCondition(current.weather_code);
          document.getElementById('humidity').innerText = Math.round(current.relative_humidity_2m);
          document.getElementById('wind').innerText = Math.round(current.wind_speed_10m);

          var now = new Date();
          document.getElementById('last-updated').innerText = 'Last updated: ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
      };
      xhr.send();
    }

    // Initialize and run periodic updates
    updateClock();
    fetchWeather();
    setInterval(updateClock, 10000); // Check time every 10 sec
  </script>
</body>
</html>
