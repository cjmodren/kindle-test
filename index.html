<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Auto-refreshes the page every 15 minutes (900 seconds) -->
  <meta http-equiv="refresh" content="900">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Dashboard Landscape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* Lock body dimensions to prevent scrollbars when rotated */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Rotates portrait viewport 90 degrees clockwise for landscape viewing */
    .landscape-container {
      width: 100vh;
      height: 100vw;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
    }

    .top-section {
      margin-top: 10px;
      text-align: center;
    }
    .location {
      font-size: 1.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .date {
      font-size: 2rem;
      margin-top: 5px;
      font-weight: 500;
    }

    /* Main middle layout split into left/right blocks */
    .middle-section {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 10px 0;
    }
    .time {
      font-size: 6.5rem;
      font-weight: bold;
      line-height: 1;
    }
    .v-divider {
      width: 4px;
      height: 120px;
      background-color: #000000;
    }
    .weather-box {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .temp {
      font-size: 5rem;
      font-weight: bold;
    }
    .details {
      text-align: left;
      font-size: 1.4rem;
      line-height: 1.5;
    }

    .status {
      text-align: center;
      font-size: 1rem;
      color: #333333;
    }
  </style>
</head>
<body>

  <div class="landscape-container">
    <div class="top-section">
      <div class="location">Plant City, FL</div>
      <div id="date" class="date">--</div>
    </div>

    <div class="middle-section">
      <div id="time" class="time">--:--</div>
      <div class="v-divider"></div>
      <div class="weather-box">
        <div id="temp" class="temp">--°F</div>
        <div class="details">
          <div id="condition">Loading...</div>
          <div>Humidity: <span id="humidity">--</span>%</div>
          <div>Wind: <span id="wind">--</span> mph</div>
        </div>
      </div>
    </div>

    <div id="last-updated" class="status">Updating...</div>
  </div>

  <script>
    function updateClock() {
      var now = new Date();
      var dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString('en-US', dateOptions);

      var hours = now.getHours();
      var minutes = now.getMinutes();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      
      document.getElementById('time').innerText = hours + ':' + minutes + ' ' + ampm;
    }

    function getWeatherCondition(code) {
      if (code === 0) return "Clear Sky";
      if (code === 1 || code === 2 || code === 3) return "Partly Cloudy";
      if (code >= 45 && code <= 48) return "Foggy";
      if (code >= 51 && code <= 55) return "Drizzle";
      if (code >= 61 && code <= 65) return "Rain";
      if (code >= 80 && code <= 82) return "Showers";
      if (code >= 95) return "Thunderstorm";
      return "Overcast";
    }

    function fetchWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=28.0181&longitude=-82.1226&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          var current = data.current;

          document.getElementById('temp').innerText = Math.round(current.temperature_2m) + '°F';
          document.getElementById('condition').innerText = getWeatherCondition(current.weather_code);
          document.getElementById('humidity').innerText = Math.round(current.relative_humidity_2m);
          document.getElementById('wind').innerText = Math.round(current.wind_speed_10m);

          var now = new Date();
          document.getElementById('last-updated').innerText = 'Last updated: ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
      };
      xhr.send();
    }

    updateClock();
    fetchWeather();
    setInterval(updateClock, 10000);
  </script>
</body>
</html>
